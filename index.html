<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<title>Hours & Minutes Calculator</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --border: #e5e7eb;
    --result-bg: #eef2ff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14151a;
      --card-bg: #1e2028;
      --text: #eaeaea;
      --muted: #9ca3af;
      --accent: #818cf8;
      --accent-hover: #a5b4fc;
      --border: #33343d;
      --result-bg: #23253a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14151a;
    --card-bg: #1e2028;
    --text: #eaeaea;
    --muted: #9ca3af;
    --accent: #818cf8;
    --accent-hover: #a5b4fc;
    --border: #33343d;
    --result-bg: #23253a;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    width: 100%;
    max-width: 520px;
  }
  h1 {
    font-size: 1.6rem;
    margin: 0 0 6px;
  }
  p.subtitle {
    color: var(--muted);
    margin: 0 0 22px;
    font-size: 1.05rem;
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 22px;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    flex: 1;
    background: none;
    border: none;
    padding: 14px 0;
    font-size: 1.1rem;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    font-weight: 600;
  }
  .panel { display: none; }
  .panel.active { display: block; }

  .row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 18px;
  }
  .row label {
    width: 80px;
    font-size: 1.05rem;
    color: var(--muted);
  }
  @media (max-width: 380px) {
    body { padding: 12px 8px; }
    .card { padding: 16px; }
    .row label { width: 62px; font-size: 0.95rem; }
  }
  .row input {
    flex: 1;
    min-width: 0;
    padding: 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 1.25rem;
  }
  .op-row {
    display: flex;
    justify-content: center;
    margin: 4px 0 18px;
  }
  .op-row select {
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 1.1rem;
  }
  .entries {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 18px;
  }
  .entry {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .entry input {
    flex: 1;
    min-width: 0;
    padding: 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 1.25rem;
  }
  .entry button.remove {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.6rem;
    cursor: pointer;
    padding: 0 8px;
    line-height: 1;
  }
  .entry button.remove:hover { color: #ef4444; }

  button.primary {
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 1.15rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
  }
  button.primary:hover { background: var(--accent-hover); }

  button.secondary {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px dashed var(--border);
    background: none;
    color: var(--accent);
    font-size: 1.05rem;
    cursor: pointer;
    margin-bottom: 18px;
  }

  .result {
    margin-top: 20px;
    background: var(--result-bg);
    border-radius: 14px;
    padding: 20px;
    text-align: center;
  }
  .result .big {
    font-size: 2.1rem;
    font-weight: 700;
    color: var(--accent);
  }
  .result .small {
    font-size: 1rem;
    color: var(--muted);
    margin-top: 6px;
  }
  .error {
    color: #ef4444;
    font-size: 1rem;
    margin-top: 12px;
    text-align: center;
  }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>⏱️ Hours & Minutes Calculator</h1>
  <p class="subtitle">Add, subtract, or sum durations in hours and minutes.</p>

  <div class="tabs">
    <button class="tab active" data-tab="twoValue">Two Values</button>
    <button class="tab" data-tab="sumList">Sum a List</button>
  </div>

  <!-- Two-value add/subtract -->
  <div class="panel active" id="panel-twoValue">
    <div class="row">
      <label>Time 1</label>
      <input type="text" id="t1" placeholder="e.g. 235 becomes 2:35" inputmode="numeric">
    </div>

    <div class="op-row">
      <select id="operation">
        <option value="add">+ Add</option>
        <option value="subtract">− Subtract</option>
      </select>
    </div>

    <div class="row">
      <label>Time 2</label>
      <input type="text" id="t2" placeholder="e.g. 115 becomes 1:15" inputmode="numeric">
    </div>

    <button class="primary" onclick="calcTwoValue()">Calculate</button>
    <div id="error-twoValue" class="error hidden"></div>
    <div id="result-twoValue" class="result hidden">
      <div class="big" id="result-twoValue-big"></div>
      <div class="small" id="result-twoValue-small"></div>
    </div>
  </div>

  <!-- Sum a list -->
  <div class="panel" id="panel-sumList">
    <div class="entries" id="entries"></div>
    <button class="secondary" onclick="addEntry()">+ Add another entry</button>
    <button class="primary" onclick="calcSumList()">Calculate Total</button>
    <div id="error-sumList" class="error hidden"></div>
    <div id="result-sumList" class="result hidden">
      <div class="big" id="result-sumList-big"></div>
      <div class="small" id="result-sumList-small"></div>
    </div>
  </div>
</div>

<script>
  // Tab switching
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
    });
  });

  // Auto-inserts a colon as the user types digits, e.g. "235" -> "2:35"
  function autoFormatTime(e) {
    const input = e.target;
    const digits = input.value.replace(/\D/g, '');
    if (digits.length > 2) {
      const minutes = digits.slice(-2);
      const hours = digits.slice(0, -2);
      input.value = hours + ':' + minutes;
    } else {
      input.value = digits;
    }
  }

  function attachAutoFormat(input) {
    input.addEventListener('input', autoFormatTime);
  }

  // Parses strings like "2:30", "2h 30m", "2h30m", "2h", "30m", "45", "2.5h"
  function parseTime(str) {
    if (str == null) return null;
    const s = str.trim();
    if (s === '') return null;

    // Colon format: H:MM
    if (s.includes(':')) {
      const [hPart, mPart] = s.split(':');
      const h = parseFloat(hPart) || 0;
      const m = parseFloat(mPart) || 0;
      return h * 60 + m;
    }

    // h/m suffix format
    const hMatch = s.match(/([\d.]+)\s*h/i);
    const mMatch = s.match(/([\d.]+)\s*m/i);
    if (hMatch || mMatch) {
      const h = hMatch ? parseFloat(hMatch[1]) : 0;
      const m = mMatch ? parseFloat(mMatch[1]) : 0;
      return h * 60 + m;
    }

    // Plain number: treat as minutes
    const plain = parseFloat(s);
    if (!isNaN(plain)) return plain;

    return null;
  }

  function formatDuration(totalMinutes) {
    const sign = totalMinutes < 0 ? '-' : '';
    const abs = Math.abs(totalMinutes);
    const h = Math.floor(abs / 60);
    const m = abs % 60;
    return { display: `${sign}${h}h ${m}m`, totalMinutes };
  }

  function calcTwoValue() {
    const raw1 = document.getElementById('t1').value;
    const raw2 = document.getElementById('t2').value;
    const op = document.getElementById('operation').value;
    const errEl = document.getElementById('error-twoValue');
    const resEl = document.getElementById('result-twoValue');

    const total1 = parseTime(raw1);
    const total2 = parseTime(raw2);

    if (total1 === null) {
      showError(errEl, resEl, 'Please enter a valid Time 1 (e.g. 2:30 or 2h 30m).');
      return;
    }
    if (total2 === null) {
      showError(errEl, resEl, 'Please enter a valid Time 2 (e.g. 1:15 or 1h 15m).');
      return;
    }

    const result = op === 'add' ? total1 + total2 : total1 - total2;
    const { display } = formatDuration(result);

    errEl.classList.add('hidden');
    resEl.classList.remove('hidden');
    document.getElementById('result-twoValue-big').textContent = display;
    document.getElementById('result-twoValue-small').textContent = `${result} total minutes`;
  }

  // Sum list logic
  let entryCount = 0;

  function addEntry() {
    entryCount++;
    const entries = document.getElementById('entries');
    const div = document.createElement('div');
    div.className = 'entry';
    div.dataset.id = entryCount;
    div.innerHTML = `
      <input type="text" placeholder="e.g. 235 becomes 2:35" inputmode="numeric" class="entry-t">
      <button class="remove" onclick="removeEntry(this)">✕</button>
    `;
    entries.appendChild(div);
    attachAutoFormat(div.querySelector('.entry-t'));
  }

  function removeEntry(btn) {
    btn.closest('.entry').remove();
  }

  function calcSumList() {
    const errEl = document.getElementById('error-sumList');
    const resEl = document.getElementById('result-sumList');
    const entryDivs = document.querySelectorAll('#entries .entry');

    if (entryDivs.length === 0) {
      showError(errEl, resEl, 'Add at least one entry first.');
      return;
    }

    let total = 0;
    let hasValue = false;
    entryDivs.forEach(div => {
      const raw = div.querySelector('.entry-t').value;
      const parsed = parseTime(raw);
      if (parsed !== null) {
        hasValue = true;
        total += parsed;
      }
    });

    if (!hasValue) {
      showError(errEl, resEl, 'Please enter at least one value.');
      return;
    }

    const { display } = formatDuration(total);
    errEl.classList.add('hidden');
    resEl.classList.remove('hidden');
    document.getElementById('result-sumList-big').textContent = display;
    document.getElementById('result-sumList-small').textContent = `${total} total minutes across ${entryDivs.length} entries`;
  }

  function showError(errEl, resEl, msg) {
    errEl.textContent = msg;
    errEl.classList.remove('hidden');
    resEl.classList.add('hidden');
  }

  // Start with two entries in the sum list
  attachAutoFormat(document.getElementById('t1'));
  attachAutoFormat(document.getElementById('t2'));
  addEntry();
  addEntry();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
